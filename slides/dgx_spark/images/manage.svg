<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="mW" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#e5e7eb"/></marker>
    <marker id="mC" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#67e8f9"/></marker>
    <marker id="mP" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#c4b5fd"/></marker>
  </defs>

  <rect x="640" y="16" width="340" height="96" rx="8" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
  <text x="810" y="44" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">設定リポジトリ（GitHub）</text>
  <text x="810" y="68" fill="#a5f3fc" font-size="12" text-anchor="middle">入れるツールと設定をコードで宣言。</text>
  <text x="810" y="88" fill="#a5f3fc" font-size="12" text-anchor="middle">home-manager がこれを読んで各機体に適用する</text>

  <rect x="40" y="170" width="220" height="150" rx="8" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <text x="150" y="196" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Mac（手元）</text>
  <rect x="58" y="210" width="184" height="44" rx="6" fill="#3b0764" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="150" y="238" fill="#ffffff" font-size="13" text-anchor="middle">Claude Code</text>
  <rect x="58" y="262" width="184" height="44" rx="6" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="290" fill="#e5e7eb" font-size="13" text-anchor="middle">エディタ / git</text>

  <rect x="380" y="218" width="200" height="54" rx="27" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
  <text x="480" y="251" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Tailscale SSH</text>

  <rect x="700" y="160" width="380" height="90" rx="8" fill="#3b0764" stroke="#c4b5fd" stroke-width="2"/>
  <text x="722" y="192" fill="#ffffff" font-size="15" font-weight="bold">gx10-1</text>
  <text x="722" y="222" fill="#ddd6fe" font-size="12">設定リポジトリを clone して置いてある</text>

  <rect x="700" y="285" width="380" height="90" rx="8" fill="#083344" stroke="#67e8f9" stroke-width="2"/>
  <text x="722" y="317" fill="#ffffff" font-size="15" font-weight="bold">gx10-2</text>
  <text x="722" y="347" fill="#a5f3fc" font-size="12">同じリポジトリから、2台とも同じ設定になる</text>

  <path d="M150,168 L150,62 L634,62" fill="none" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#mW)"/>
  <text x="390" y="50" fill="#e5e7eb" font-size="13" font-weight="bold" text-anchor="middle">① 編集して push</text>

  <path d="M980,64 L1120,64 L1120,205 L1086,205" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#mC)"/>
  <path d="M1120,205 L1120,330 L1086,330" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#mC)"/>
  <circle cx="1120" cy="205" r="4" fill="#67e8f9"/>
  <text x="900" y="133" fill="#67e8f9" font-size="13" font-weight="bold" text-anchor="middle">② git pull → home-manager で適用</text>

  <path d="M262,245 L374,245" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#mP)"/>
  <path d="M580,245 L640,245 L640,205 L694,205" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#mP)"/>
  <path d="M640,245 L640,330 L694,330" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#mP)"/>
  <circle cx="640" cy="245" r="4" fill="#c4b5fd"/>
  <text x="318" y="232" fill="#c4b5fd" font-size="12" font-weight="bold" text-anchor="middle">③</text>
  <text x="480" y="298" fill="#c4b5fd" font-size="12.5" text-anchor="middle">③ Claude Code が2台に入って</text>
  <text x="480" y="317" fill="#c4b5fd" font-size="12.5" text-anchor="middle">調査・設定・デバッグ（非対話でも通る）</text>

</svg>
