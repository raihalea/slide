<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 260" width="1160" height="260" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="lW" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#e5e7eb"/></marker>
    <marker id="lG" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 z" fill="#4ade80"/></marker>
  </defs>

  <text x="120" y="38" fill="#67e8f9" font-size="13.5" font-weight="bold" text-anchor="middle">① 起票は3通り</text>

  <rect x="25" y="48" width="190" height="48" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="120" y="68" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">人間が直接起票</text>
  <text x="120" y="87" fill="#a7f3d0" font-size="11" text-anchor="middle">Linear で普通に書く</text>

  <rect x="25" y="106" width="190" height="48" rx="8" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
  <text x="120" y="126" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">Discord で Hermes に依頼</text>
  <text x="120" y="145" fill="#c7d2fe" font-size="11" text-anchor="middle">チャットの指示で起票してくれる</text>

  <rect x="25" y="164" width="190" height="48" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="184" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">scout が自動起票</text>
  <text x="120" y="203" fill="#cbd5e1" font-size="11" text-anchor="middle">毎週の点検で提案を最大3件</text>

  <rect x="247" y="76" width="190" height="106" rx="8" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
  <text x="342" y="104" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">② Linear チケット</text>
  <text x="342" y="128" fill="#a5f3fc" font-size="11.5" text-anchor="middle">自動起票の提案には</text>
  <text x="342" y="148" fill="#a5f3fc" font-size="11.5" text-anchor="middle">ラベル「hermes-proposal」が</text>
  <text x="342" y="168" fill="#a5f3fc" font-size="11.5" text-anchor="middle">付く（人間の起票と区別）</text>

  <text x="564" y="66" fill="#fbbf24" font-size="13.5" font-weight="bold" text-anchor="middle">③ ラベル「hermes-go」を付ける</text>

  <rect x="469" y="76" width="190" height="48" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="564" y="96" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">人間が付ける</text>
  <text x="564" y="115" fill="#a7f3d0" font-size="11" text-anchor="middle">チケットを確認して承認</text>

  <rect x="469" y="134" width="190" height="48" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
  <text x="564" y="154" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">scout が自動で付ける</text>
  <text x="564" y="173" fill="#fde68a" font-size="11" text-anchor="middle">価値判定を通ったものだけ</text>

  <rect x="691" y="76" width="190" height="106" rx="8" fill="#3b0764" stroke="#c4b5fd" stroke-width="2"/>
  <text x="786" y="104" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">④ Hermes Agent が実装</text>
  <text x="786" y="126" fill="#ddd6fe" font-size="11.5" text-anchor="middle">15分毎、1回1件</text>
  <text x="786" y="148" fill="#ddd6fe" font-size="11.5" text-anchor="middle">テストと lint 合格時だけ PR</text>
  <text x="786" y="166" fill="#f87171" font-size="11.5" text-anchor="middle">不合格ならラベルを外して差戻し</text>

  <rect x="913" y="76" width="190" height="106" rx="8" fill="#064e3b" stroke="#4ade80" stroke-width="3"/>
  <text x="1008" y="104" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">⑤ 人間がマージ</text>
  <text x="1008" y="128" fill="#a7f3d0" font-size="11.5" text-anchor="middle">唯一の承認ゲート</text>
  <text x="1008" y="150" fill="#a7f3d0" font-size="11.5" text-anchor="middle">main への直接 push と</text>
  <text x="1008" y="168" fill="#a7f3d0" font-size="11.5" text-anchor="middle">デプロイは禁止</text>

  <line x1="215" y1="72" x2="241" y2="100" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>
  <line x1="215" y1="130" x2="241" y2="129" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>
  <line x1="215" y1="188" x2="241" y2="158" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>

  <line x1="437" y1="112" x2="463" y2="100" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>
  <line x1="437" y1="146" x2="463" y2="158" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>

  <line x1="659" y1="100" x2="685" y2="112" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>
  <line x1="659" y1="158" x2="685" y2="146" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>
  <line x1="881" y1="129" x2="907" y2="129" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#lW)"/>

  <path d="M1008,182 L1008,246 L120,246 L120,216" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#lG)"/>
  <text x="564" y="238" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">マージすると Linear ⇔ GitHub 連携で自動 Done、そして次の巡回へ</text>

</svg>
